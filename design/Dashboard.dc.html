<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    :where(*) { box-sizing: border-box; }
    .app {
      --bg: oklch(96% 0.025 75);
      --surface: oklch(99% 0.008 75);
      --surface-2: oklch(94% 0.02 80);
      --ink: oklch(32% 0.045 50);
      --ink-soft: oklch(52% 0.035 55);
      --coral: oklch(70% 0.19 35);
      --coral-dark: oklch(58% 0.18 32);
      --coral-wash: oklch(93% 0.05 35);
      --leaf: oklch(66% 0.15 148);
      --leaf-dark: oklch(50% 0.13 148);
      --leaf-wash: oklch(93% 0.06 148);
      --sky: oklch(75% 0.1 232);
      --sky-dark: oklch(56% 0.1 232);
      --sky-wash: oklch(94% 0.03 232);
      --sun: oklch(83% 0.15 88);
      --sun-dark: oklch(64% 0.14 75);
      --sun-wash: oklch(94% 0.06 90);
      font-family: 'Nunito', ui-rounded, 'Segoe UI', sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    .disp { font-family: 'Baloo 2', ui-rounded, sans-serif; }
    .card { background: var(--surface); border-radius: 24px; box-shadow: 0 10px 24px rgba(120,70,30,0.10); }
  </style>
</helmet>

<div class="app" style="position:relative; width:1024px; height:768px; overflow:hidden; padding:26px 34px;">

  <!-- header -->
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;">
    <div>
      <h1 class="disp" style="margin:0; font-size:30px; font-weight:700; color:var(--coral-dark);">Mia's Progress</h1>
      <p style="margin:2px 0 0; font-size:14px; color:var(--ink-soft);">Week of Sep 7 – 13</p>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="display:flex; align-items:center; gap:6px; background:var(--sky-wash); border-radius:16px; padding:7px 14px;">
        <svg viewBox="0 0 24 24" style="width:14px; height:14px;"><rect x="5" y="10" width="14" height="10" rx="2" fill="var(--sky-dark)"/><path d="M8,10 L8,7 A4,4 0 0,1 16,7 L16,10" fill="none" stroke="var(--sky-dark)" stroke-width="2"/></svg>
        <span style="font-size:12px; font-weight:800; color:var(--sky-dark);">Parent view</span>
      </div>
      <button style="background:var(--surface-2); border:2px solid var(--sky-wash); border-radius:18px; padding:9px 18px; font-weight:800; font-size:13px; color:var(--ink-soft); cursor:pointer;">Back to game</button>
    </div>
  </div>

  <!-- main grid -->
  <div style="display:grid; grid-template-columns:1.3fr 1fr; gap:20px;">

    <!-- alphabet mastery -->
    <div class="card" style="padding:22px 24px;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;">
        <span class="disp" style="font-size:18px; font-weight:700; color:var(--ink);">Alphabet Mastery</span>
        <div style="display:flex; gap:14px;">
          <span style="display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-soft);"><span style="width:10px; height:10px; border-radius:50%; background:var(--leaf); display:inline-block;"></span>Mastered</span>
          <span style="display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-soft);"><span style="width:10px; height:10px; border-radius:50%; background:var(--sun); display:inline-block;"></span>Practicing</span>
          <span style="display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-soft);"><span style="width:10px; height:10px; border-radius:50%; background:var(--surface); border:2px solid var(--sky-wash); display:inline-block;"></span>Not started</span>
        </div>
      </div>
      <div style="display:grid; grid-template-columns:repeat(9, minmax(0,1fr)); gap:8px;">
        <sc-for list="{{letters}}" as="l" hint-placeholder-count="26">
          <div style="aspect-ratio:1; border-radius:14px; display:flex; align-items:center; justify-content:center; background:{{l.bg}}; border:{{l.border}};">
            <span class="disp" style="font-size:19px; font-weight:700; color:{{l.fg}};">{{l.ch}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- word lists -->
    <div style="display:flex; flex-direction:column; gap:16px;">
      <div class="card" style="padding:18px 20px;">
        <span class="disp" style="font-size:16px; font-weight:700; color:var(--leaf-dark);">Words I Know Well</span>
        <div style="display:flex; flex-direction:column; gap:9px; margin-top:10px;">
          <sc-for list="{{known}}" as="w" hint-placeholder-count="3">
            <div style="display:flex; align-items:center; justify-content:space-between; background:var(--leaf-wash); border-radius:14px; padding:9px 14px;">
              <span style="font-size:14px; font-weight:700; color:var(--ink);">{{w}}</span>
              <svg viewBox="0 0 20 20" style="width:18px; height:18px;"><circle cx="10" cy="10" r="9" fill="var(--leaf)"/><path d="M6,10 L9,13 L14,6.5" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
          </sc-for>
        </div>
      </div>
      <div class="card" style="padding:18px 20px;">
        <span class="disp" style="font-size:16px; font-weight:700; color:var(--sun-dark);">Needs More Practice</span>
        <div style="display:flex; flex-direction:column; gap:9px; margin-top:10px;">
          <sc-for list="{{practice}}" as="w" hint-placeholder-count="1">
            <div style="display:flex; align-items:center; justify-content:space-between; background:var(--sun-wash); border-radius:14px; padding:9px 14px;">
              <span style="font-size:14px; font-weight:700; color:var(--ink);">{{w}}</span>
              <svg viewBox="0 0 20 20" style="width:16px; height:16px;"><path d="M4,10 A6,6 0 1,1 6,14.5 M4,10 L4,6 M4,10 L8,10" stroke="var(--sun-dark)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </div>

  <!-- bottom stats -->
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:20px;">
    <div class="card" style="padding:20px 24px; display:flex; flex-direction:column; gap:12px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <svg viewBox="0 0 24 24" style="width:18px; height:18px;"><path d="M12,2 C10,7 6,9 6,14 A6,6 0 0,0 18,14 C18,9 14,7 12,2 Z" fill="var(--leaf-dark)"/></svg>
        <span class="disp" style="font-size:16px; font-weight:700; color:var(--ink);">5-day streak!</span>
      </div>
      <div style="display:flex; gap:8px;">
        <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
          <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
            <div style="width:32px; height:32px; border-radius:9px; background:{{d.bg}}; border:{{d.border}};"></div>
            <span style="font-size:10.5px; color:var(--ink-soft); font-weight:700;">{{d.label}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <div class="card" style="padding:20px 24px; display:flex; flex-direction:column; gap:10px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <svg viewBox="0 0 24 24" style="width:18px; height:18px;"><circle cx="12" cy="12" r="9" fill="none" stroke="var(--sky-dark)" stroke-width="1.8"/><path d="M12,7 L12,12 L16,14" stroke="var(--sky-dark)" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
        <span class="disp" style="font-size:16px; font-weight:700; color:var(--ink);">Time This Week</span>
      </div>
      <div style="display:flex; align-items:flex-end; gap:12px;">
        <span style="font-size:34px; font-weight:800; color:var(--sky-dark);">42<span style="font-size:16px; font-weight:700; margin-left:3px;">min</span></span>
        <div style="display:flex; align-items:flex-end; gap:5px; height:34px; margin-bottom:3px;">
          <sc-for list="{{minutes}}" as="m" hint-placeholder-count="7">
            <div style="width:9px; height:{{m}}px; border-radius:3px; background:var(--sky);"></div>
          </sc-for>
        </div>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    const mastered = ['A','B','C'];
    const practicing = ['D'];
    const letters = alphabet.map(ch => {
      const isM = mastered.includes(ch);
      const isP = practicing.includes(ch);
      return {
        ch,
        bg: isM ? 'var(--leaf)' : (isP ? 'var(--sun)' : 'var(--surface-2)'),
        fg: isM || isP ? 'white' : 'var(--ink-soft)',
        border: isM || isP ? 'none' : '2px solid var(--sky-wash)',
      };
    });
    const known = ['Apple', 'Ball', 'Cat'];
    const practice = ['Dog'];
    const days = ['M','T','W','T','F','S','S'];
    const practiced = [true, true, true, false, true, true, false];
    const week = days.map((label, i) => ({
      label,
      bg: practiced[i] ? 'var(--leaf)' : 'var(--surface-2)',
      border: practiced[i] ? 'none' : '2px solid var(--sky-wash)',
    }));
    const minutes = [10, 18, 14, 6, 22, 28, 8];
    return { letters, known, practice, week, minutes };
  }
}
</script>
</body>
</html>
