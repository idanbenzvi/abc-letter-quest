<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    :where(*) { box-sizing: border-box; }
    .app {
      --bg: oklch(96% 0.025 75);
      --surface: oklch(99% 0.008 75);
      --surface-2: oklch(94% 0.02 80);
      --ink: oklch(32% 0.045 50);
      --ink-soft: oklch(52% 0.035 55);
      --coral: oklch(70% 0.19 35);
      --coral-dark: oklch(58% 0.18 32);
      --coral-wash: oklch(93% 0.05 35);
      --leaf: oklch(66% 0.15 148);
      --leaf-dark: oklch(50% 0.13 148);
      --leaf-wash: oklch(93% 0.06 148);
      --sky: oklch(75% 0.1 232);
      --sky-dark: oklch(56% 0.1 232);
      --sky-wash: oklch(94% 0.03 232);
      --sun: oklch(83% 0.15 88);
      --sun-dark: oklch(64% 0.14 75);
      --sun-wash: oklch(94% 0.06 90);
      --berry: oklch(64% 0.17 350);
      --berry-wash: oklch(93% 0.04 350);
      --sand: oklch(78% 0.09 70);
      --sand-dark: oklch(60% 0.09 60);
      font-family: 'Nunito', ui-rounded, 'Segoe UI', sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    .disp { font-family: 'Baloo 2', ui-rounded, sans-serif; }
  </style>
</helmet>

<div class="app" style="position:relative; width:1024px; height:768px; overflow:hidden;">

  <div style="position:absolute; top:-70px; right:-70px; width:260px; height:260px; border-radius:50%; background:var(--sky-wash); opacity:0.6;"></div>
  <div style="position:absolute; bottom:-80px; left:-60px; width:260px; height:260px; border-radius:50%; background:var(--sun-wash); opacity:0.5;"></div>

  <!-- top bar -->
  <div style="position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; padding:20px 30px;">
    <button style="width:42px; height:42px; border-radius:50%; background:var(--surface); border:2px solid var(--sky-wash); display:flex; align-items:center; justify-content:center; cursor:pointer;">
      <svg viewBox="0 0 24 24" style="width:18px; height:18px;"><path d="M15,5 L8,12 L15,19" stroke="var(--ink-soft)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div style="display:flex; gap:8px;">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="5">
        <div style="width:11px; height:11px; border-radius:50%; background:{{d.c}};"></div>
      </sc-for>
    </div>
    <div style="display:flex; align-items:center; gap:6px; background:var(--sun-wash); border-radius:20px; padding:8px 14px;">
      <svg viewBox="0 0 24 24" style="width:16px; height:16px;"><polygon points="12,2 15,9 22,10 17,15 18,22 12,18 6,22 7,15 2,10 9,9" fill="var(--sun-dark)"/></svg>
      <span style="font-weight:800; font-size:14px; color:var(--sun-dark);">18</span>
    </div>
  </div>

  <!-- main two-column area -->
  <div style="position:relative; z-index:2; display:flex; gap:28px; padding:6px 40px 0;">

    <!-- giant letter: mid-reveal -->
    <div style="flex:0 0 300px; display:flex; flex-direction:column; align-items:center; gap:12px;">
      <div style="background:var(--surface); border-radius:18px 18px 18px 4px; padding:9px 16px; box-shadow:0 8px 18px rgba(80,50,20,0.1); max-width:230px; text-align:center;">
        <span style="font-size:13px; font-weight:700; color:var(--ink);">Listen close — you already know this sound!</span>
      </div>
      <div style="position:relative; width:240px; height:240px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; box-shadow:inset 0 0 0 3px var(--sky-wash); overflow:hidden;">
        <span style="position:absolute; font-size:150px; font-weight:800; color:transparent; -webkit-text-stroke:3px var(--sky-dark); opacity:0.45; font-family:'Nunito', sans-serif; line-height:1;">Dd</span>
        <span style="position:absolute; font-size:150px; font-weight:800; color:var(--coral); font-family:'Nunito', sans-serif; line-height:1; clip-path:inset(0 32% 0 0);">Dd</span>
        <svg viewBox="0 0 24 24" style="position:absolute; top:76px; right:64px; width:20px; height:20px;"><path d="M12,4 L13.4,10.6 L20,12 L13.4,13.4 L12,20 L10.6,13.4 L4,12 L10.6,10.6 Z" fill="var(--sun)"/></svg>
        <svg viewBox="0 0 24 24" style="position:absolute; top:132px; right:50px; width:12px; height:12px;"><path d="M12,4 L13.4,10.6 L20,12 L13.4,13.4 L12,20 L10.6,13.4 L4,12 L10.6,10.6 Z" fill="var(--sun)" opacity="0.8"/></svg>
      </div>
      <button style="display:flex; align-items:center; gap:8px; background:var(--sky); color:white; border:none; border-radius:24px; padding:10px 22px; font-weight:800; font-size:14px; cursor:pointer; box-shadow:0 8px 18px rgba(60,120,160,0.3);">
        <svg viewBox="0 0 24 24" style="width:16px; height:16px;"><path d="M4,10 L4,14 L9,14 L15,19 L15,5 L9,10 Z" fill="white"/><path d="M18,9 A5,5 0 0,1 18,15 M20.5,6.5 A9,9 0 0,1 20.5,17.5" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
        Tap to reveal its shape
      </button>
    </div>

    <!-- word card -->
    <div style="flex:1; background:var(--surface); border-radius:28px; padding:26px 30px; box-shadow:0 14px 30px rgba(120,70,30,0.12); display:flex; flex-direction:column; align-items:center; gap:14px;">
      <svg viewBox="0 0 100 100" style="width:110px; height:110px;">
        <ellipse cx="50" cy="60" rx="34" ry="28" fill="var(--sand)"/>
        <polygon points="20,40 10,15 34,32" fill="var(--sand)"/>
        <polygon points="80,40 90,15 66,32" fill="var(--sand)"/>
        <polygon points="24,36 18,20 34,30" fill="var(--berry-wash)"/>
        <polygon points="76,36 82,20 66,30" fill="var(--berry-wash)"/>
        <ellipse cx="50" cy="68" rx="22" ry="16" fill="var(--surface)"/>
        <circle cx="40" cy="54" r="5" fill="var(--ink)"/>
        <circle cx="60" cy="54" r="5" fill="var(--ink)"/>
        <ellipse cx="50" cy="66" rx="6" ry="4" fill="var(--ink)"/>
        <path d="M42,74 Q50,80 58,74" stroke="var(--ink)" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
      <div style="display:flex; align-items:baseline; gap:2px;">
        <span class="disp" style="font-size:44px; font-weight:700; color:var(--coral-dark);">D</span>
        <span class="disp" style="font-size:44px; font-weight:700; color:var(--ink);">og</span>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="background:var(--coral); color:white; font-weight:800; font-size:16px; padding:6px 16px; border-radius:16px;">/d/</div>
        <span style="font-size:13px; color:var(--ink-soft);">the sound you just found — it starts "Dog" too!</span>
      </div>
      <button style="display:flex; align-items:center; gap:8px; background:var(--coral-wash); color:var(--coral-dark); border:none; border-radius:24px; padding:9px 20px; font-weight:800; font-size:14px; cursor:pointer;">
        <svg viewBox="0 0 24 24" style="width:15px; height:15px;"><path d="M4,10 L4,14 L9,14 L15,19 L15,5 L9,10 Z" fill="var(--coral-dark)"/></svg>
        Tap to hear "Dog"
      </button>
    </div>
  </div>

  <!-- mini game -->
  <div style="position:relative; z-index:2; margin-top:22px; padding:0 40px;">
    <p class="disp" style="text-align:center; font-size:21px; font-weight:700; color:var(--ink); margin:0 0 14px;">Which picture starts with the /d/ sound?</p>
    <div style="display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:20px; max-width:820px; margin:0 auto;">

      <div style="position:relative; background:var(--leaf-wash); border:3px solid var(--leaf-dark); border-radius:22px; padding:16px; display:flex; flex-direction:column; align-items:center; gap:8px;">
        <svg viewBox="0 0 20 20" style="position:absolute; top:-9px; right:-9px; width:26px; height:26px; border-radius:50%; background:var(--leaf-dark); padding:3px;">
          <path d="M4,10 L8,14 L16,5" stroke="white" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg viewBox="0 0 100 100" style="width:76px; height:76px;">
          <ellipse cx="50" cy="60" rx="34" ry="28" fill="var(--sand)"/>
          <polygon points="20,40 10,15 34,32" fill="var(--sand)"/>
          <polygon points="80,40 90,15 66,32" fill="var(--sand)"/>
          <ellipse cx="50" cy="68" rx="22" ry="16" fill="var(--surface)"/>
          <circle cx="40" cy="54" r="5" fill="var(--ink)"/>
          <circle cx="60" cy="54" r="5" fill="var(--ink)"/>
        </svg>
        <span style="font-weight:800; font-size:15px; color:var(--leaf-dark);">Dog</span>
      </div>

      <div style="background:var(--surface); border:3px solid var(--sky-wash); border-radius:22px; padding:16px; display:flex; flex-direction:column; align-items:center; gap:8px;">
        <svg viewBox="0 0 100 100" style="width:76px; height:76px;">
          <polygon points="24,38 16,14 38,30" fill="var(--berry)"/>
          <polygon points="76,38 84,14 62,30" fill="var(--berry)"/>
          <ellipse cx="50" cy="58" rx="30" ry="26" fill="var(--berry)"/>
          <ellipse cx="50" cy="66" rx="19" ry="13" fill="var(--surface)"/>
          <circle cx="41" cy="54" r="4.5" fill="var(--ink)"/>
          <circle cx="59" cy="54" r="4.5" fill="var(--ink)"/>
          <polygon points="46,63 54,63 50,68" fill="var(--ink)"/>
        </svg>
        <span style="font-weight:800; font-size:15px; color:var(--ink-soft);">Cat</span>
      </div>

      <div style="background:var(--surface); border:3px solid var(--sky-wash); border-radius:22px; padding:16px; display:flex; flex-direction:column; align-items:center; gap:8px;">
        <svg viewBox="0 0 100 100" style="width:76px; height:76px;">
          <circle cx="50" cy="50" r="24" fill="var(--sun)"/>
          <sc-for list="{{rays}}" as="r" hint-placeholder-count="8">
            <rect x="48" y="6" width="4" height="14" rx="2" fill="var(--sun)" transform="rotate({{r}} 50 50)"/>
          </sc-for>
          <circle cx="43" cy="46" r="3" fill="var(--sand-dark)"/>
          <circle cx="57" cy="46" r="3" fill="var(--sand-dark)"/>
          <path d="M42,56 Q50,62 58,56" stroke="var(--sand-dark)" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
        <span style="font-weight:800; font-size:15px; color:var(--ink-soft);">Sun</span>
      </div>

    </div>
  </div>

  <!-- Buddy cameo -->
  <svg viewBox="0 0 200 240" style="position:absolute; bottom:-8px; left:14px; width:92px; height:110px; z-index:1;">
    <path d="M150,190 Q180,178 172,150" stroke="var(--coral)" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M50,175 Q22,178 28,152" stroke="var(--coral)" stroke-width="18" stroke-linecap="round" fill="none"/>
    <ellipse cx="100" cy="185" rx="52" ry="48" fill="var(--coral)"/>
    <ellipse cx="100" cy="196" rx="28" ry="26" fill="var(--surface)"/>
    <circle cx="100" cy="95" r="56" fill="var(--coral)"/>
    <polygon points="56,58 42,8 82,50" fill="var(--coral)"/>
    <polygon points="60,48 53,25 74,47" fill="var(--surface)"/>
    <polygon points="144,58 158,8 118,50" fill="var(--coral)"/>
    <polygon points="140,48 147,25 126,47" fill="var(--surface)"/>
    <ellipse cx="100" cy="115" rx="36" ry="26" fill="var(--surface)"/>
    <circle cx="81" cy="90" r="7" fill="var(--ink)"/>
    <circle cx="119" cy="90" r="7" fill="var(--ink)"/>
    <ellipse cx="100" cy="106" rx="5.5" ry="3.6" fill="var(--ink-soft)"/>
    <path d="M88,118 Q100,127 112,118" stroke="var(--ink)" stroke-width="2.3" fill="none" stroke-linecap="round"/>
  </svg>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const dots = [0,1,2,3,4].map(i => ({ c: i < 2 ? 'var(--coral)' : 'var(--surface-2)' }));
    const rays = [0,45,90,135,180,225,270,315];
    return { dots, rays };
  }
}
</script>
</body>
</html>
